# mochi config. Copy to ~/.mochi/config.toml. [providers], [models] brain and fast, and [web] are required.
# Keys and tokens go in ~/.mochi/.env (see .env.example), never here.

# Your time zone. Default: the machine's.
timeZone = "America/New_York"

# How mochi reaches models. Each provider is an endpoint, the protocol it speaks, and the
# variable that holds its key:
#   api is any pi-ai api id: anthropic-messages, openai-responses, openai-completions,
#   google-generative-ai, bedrock-converse-stream, mistral-conversations, ... for chat models,
#   and typesafe-system-one, cloudflare-workers-ai-system-one, openai-decisions or
#   llama-cpp-classify for the classifier model. Every provider names its url and keyEnv.
# A gateway is one provider per protocol it serves.
[providers.anthropic]
api = "anthropic-messages"
url = "https://api.anthropic.com"
keyEnv = "ANTHROPIC_API_KEY"

# [providers.openrouter]
# api = "openai-completions"
# url = "https://openrouter.ai/api/v1"
# keyEnv = "OPENROUTER_API_KEY"

# A model is <provider>/<model id>. The brain answers you; the fast model summarizes,
# runs routines and reads data for scripts.
[models]
brain = "anthropic/claude-opus-5-5"
fast = "anthropic/claude-haiku-5-5"

# The decision model for classify, on a provider with a classifier api. With none set, classify fails.
# classifier = "classifier/liquid/d1-ultra"

[models.aliases]
haiku = "anthropic/claude-haiku-5-5"

# [providers.classifier]
# api = "typesafe-system-one"
# url = "https://openrouter.ai/api/v1"
# keyEnv = "OPENROUTER_API_KEY"

# Voice notes in and speech out, through any provider that serves the OpenAI audio API
# (/audio/speech and /audio/transcriptions). provider names a [providers] entry. Images and
# video take [media.images] and [media.video] with baseUrl, keyEnv and model.
# [providers.gateway]
# api = "openai-responses"
# url = "https://gateway.example.com/openai/v1"
# keyEnv = "GATEWAY_API_KEY"
#
# [media.speech]
# provider = "gateway"
# tts = "gpt-4o-mini-tts"
# stt = "gpt-4o-transcribe"
# voice = "coral"

# Routines. Each runs in its own conversation and reaches you only by notify. A run is an
# ordered chain of steps: a classify step is a fast yes/no question that stops the chain on
# no, before the model runs (on = "output" judges the notify text instead); { model = {} }
# is the run of prompt. Without steps a routine is one model step. profile names whose
# instructions, model and memory the run uses. Each entry loads as a schedule; the key keeps
# the name [[triggers]]. kind is "cron" (cron, tz), "at" (at) or "webhook" (auth).
# [[triggers]]
# kind = "cron"
# id = "morning"
# cron = "0 8 * * *"
# tz = "America/New_York"
# profile = "worker"
# prompt = "Check my calendar for today and tell me only what needs me."
# steps = [
#   { model = {} },
#   { classify = { question = "Does this message need the owner today?", yes = "an event or task needs them", no = "nothing to act on", on = "output" } },
# ]

# Profiles are standing teammates in this daemon. Each is ~/.mochi/profiles/<name>/instructions.md:
# front matter with description, model, thinking and optionally tools (a comma list of script
# functions it may use), then its role. mochi gives them work with profile_send.

# Other people who may text mochi on iMessage, each in a thread of their own.
# [[users]]
# id = "user2"
# handle = "+15550100002"
# name = "Alex"

# App tools through an MCP server with execute and skills tools. Log in with: mochi auth apps
# appsUrl = "https://apps.example.com/mcp"

# Web search, fetch and the logged-in browser. Required. The client speaks Firecrawl's v2 API.
[web]
url = "https://api.firecrawl.dev/v2"
keyEnv = "FIRECRAWL_API_KEY"
# browserProfile = "mochi"

