# mochi config. Copy this file to ~/.mochi/config.toml. timeZone, [providers], and brain, fast and memory in [models] are
# required. A section that you leave out turns its feature off. mochi guesses nothing.
# Keys and tokens go in ~/.mochi/.env (see .env.example), never here.

# Your time zone, as an IANA name. Required.
timeZone = "America/New_York"

# How mochi reaches models. Each provider is an endpoint, the protocol it speaks, and the
# variable that holds its key. api is any pi-ai api id. Chat models use anthropic-messages,
# openai-responses, openai-completions, google-generative-ai, bedrock-converse-stream,
# mistral-conversations or another chat api. The classifier model uses typesafe-system-one,
# cloudflare-workers-ai-system-one, openai-decisions or llama-cpp-classify. Every provider
# names its url and keyEnv. A gateway is one provider per protocol that it serves.
[providers.anthropic]
api = "anthropic-messages"
url = "https://api.anthropic.com"
keyEnv = "ANTHROPIC_API_KEY"

# [providers.openrouter]
# api = "openai-completions"
# url = "https://openrouter.ai/api/v1"
# keyEnv = "OPENROUTER_API_KEY"

# A model is <provider>/<model id>. The brain answers you. The fast model reads data for
# scripts. The memory model writes the summary lines of each conversation's view.
[models]
brain = "anthropic/claude-opus-5-5"
fast = "anthropic/claude-haiku-5-5"
memory = "anthropic/claude-haiku-5-5"

# The decision model for classify and gates, on a provider with a classifier api. Without it, classify fails.
# classifier = "classifier/liquid/d1-ultra"

# Any other key is a name of your own. A definition or a tool call can use it as its model.
# opus = "anthropic/claude-opus-5-5"

# A model that pi-ai's catalog does not know needs its limits here.
# [models.overrides."gateway/some-model"]
# contextWindow = 1000000
# maxTokens = 128000

# [providers.classifier]
# api = "typesafe-system-one"
# url = "https://openrouter.ai/api/v1"
# keyEnv = "OPENROUTER_API_KEY"

# Voice notes in and speech out go through a provider that serves the OpenAI audio API
# (/audio/speech and /audio/transcriptions). provider names a [providers] entry. A [media] section
# needs [media.images], with default and a providers list (name, baseUrl, keyEnv and model each), so
# [media.speech] alone does not validate. [media.video] takes baseUrl, keyEnv and model.
# [providers.gateway]
# api = "openai-responses"
# url = "https://gateway.example.com/openai/v1"
# keyEnv = "GATEWAY_API_KEY"
#
# [media.speech]
# provider = "gateway"
# tts = "gpt-4o-mini-tts"
# stt = "gpt-4o-transcribe"
# voice = "coral"

# Webhooks for board items. Without this section, board_add refuses webhook items. host and port
# are where the server listens. url is the public base, so an item answers at <url>/hooks/<id>.
# Bind 0.0.0.0 only behind a proxy. Routines are not config. They are board items, added with board_add.
# [webhooks]
# host = "127.0.0.1"
# port = 8788
# url = "https://mochi.example.com"

# Agent definitions are teammates in this daemon, not config. Each is ~/.mochi/agents/<name>.md:
# front matter with description, model, thinking, an optional tools list (the script functions it
# may use, comma separated) and an optional resident: true, then its role. The file name is the
# name. A file there replaces the bundled definition of the same name. mochi gives definitions work
# with the agent tool. A resident definition keeps one standing conversation with its own memory.
# Any other definition runs as a fresh child for each job.

# Other people who may text mochi on iMessage, each in a thread of their own.
# [[users]]
# id = "user2"
# handle = "+15550100002"
# name = "Alex"

# MCP servers. Each [mcp.<name>] gives scripts its tools as tools.<name>_<tool>. Scripts find them with
# searchTools(). With auth = "oauth", log in once with mochi auth <name>. With auth = "bearer", the token
# is in the variable that tokenEnv names.
# [mcp.apps]
# url = "https://apps.example.com/mcp"
# auth = "oauth"
#
# [mcp.docs]
# url = "https://docs.example.com/mcp"
# auth = "bearer"
# tokenEnv = "DOCS_MCP_TOKEN"

# Web search, fetch and the logged-in browser. Without this section, there are no web tools. The client
# speaks Firecrawl's v2 API. The logged-in browser needs browserProfile.
[web]
url = "https://api.firecrawl.dev/v2"
keyEnv = "FIRECRAWL_API_KEY"
# browserProfile = "mochi"

# Nightly self-improvement (skills/improve) judges the earlier skill edits by measured signals. Then it
# proposes, applies and records new edits in <home>/improve/library.md. <home> must be a git repository.
# It is a board item, not config. Ask mochi to add it with board_add: owner "mochi",
# when { cron = "30 4 * * *", tz = "Asia/Kolkata" }, check [ "node", "<repo>/scripts/improve-check.ts", "<home>", "24" ],
# and the text "Run the improve skill: read its SKILL.md from the skills index, then follow it with the check output below."
