# mochi config. Copy to ~/.mochi/config.toml. Every key is optional.
# Keys and tokens go in ~/.mochi/.env (see .env.example), never here.

# Your time zone. Default: the machine's.
timeZone = "America/New_York"

# How mochi reaches models. Each provider is an endpoint, the protocol it speaks, and the
# variable that holds its key:
#   api = "anthropic"   Anthropic Messages
#   api = "responses"   OpenAI Responses
#   api = "chat"        OpenAI chat completions (OpenRouter, Ollama, vLLM, LiteLLM)
#   api = "classifier"  the System One classifier protocol, for the classifier model
# A gateway is one provider per protocol it serves. With no [providers], ANTHROPIC_API_KEY
# (or OPENAI_API_KEY) decides.
[providers.anthropic]
api = "anthropic"
keyEnv = "ANTHROPIC_API_KEY"

# [providers.openrouter]
# api = "chat"
# url = "https://openrouter.ai/api/v1"
# keyEnv = "OPENROUTER_API_KEY"

# A model is <provider>/<model id>. The brain answers you; the fast model summarizes,
# runs routines and reads data for scripts.
[models]
brain = "anthropic/claude-opus-5-5"
fast = "anthropic/claude-haiku-5-5"

# The yes/no classifier for classify and classify steps, on a provider with api = "classifier".
# With none set, OPENROUTER_API_KEY alone turns on its default classifier.
# classifier = "classifier/typesafe/jev-1.13"

[models.aliases]
haiku = "anthropic/claude-haiku-5-5"

# [providers.classifier]
# api = "classifier"
# url = "https://openrouter.ai/api/v1"
# keyEnv = "OPENROUTER_API_KEY"

# Voice notes in and speech out, through any provider that serves the OpenAI audio API
# (/audio/speech and /audio/transcriptions). provider names a [providers] entry. Images and
# video take [media.images] and [media.video] with baseUrl, keyEnv and model.
# [providers.gateway]
# api = "responses"
# url = "https://gateway.example.com/openai/v1"
# keyEnv = "GATEWAY_API_KEY"
#
# [media.speech]
# provider = "gateway"
# tts = "gpt-4o-mini-tts"
# stt = "gpt-4o-transcribe"
# voice = "coral"

# Routines. Each runs in its own conversation and reaches you only by notify. A run is an
# ordered chain of steps: a classify step is a fast yes/no question that stops the chain on
# no, before the model runs (on = "output" judges the notify text instead); { model = {} }
# is the run of prompt. Without steps a routine is one model step. agent names the definition
# whose instructions, model, tools and memory the run uses. Each entry loads as a schedule; the key keeps
# the name [[triggers]]. kind is "cron" (cron, tz), "at" (at) or "webhook" (auth).
# [[triggers]]
# kind = "cron"
# id = "morning"
# cron = "0 8 * * *"
# tz = "America/New_York"
# agent = "worker"
# prompt = "Check my calendar for today and tell me only what needs me."
# steps = [
#   { model = {} },
#   { classify = { question = "Does this message need the owner today?", yes = "an event or task needs them", no = "nothing to act on", on = "output" } },
# ]

# Agent definitions are teammates in this daemon. Each is ~/.mochi/agents/<name>.md: front matter
# with name, description, model, thinking, optionally tools (a comma list of script functions it
# may use) and resident: true, then its role. A file here replaces the bundled definition of the
# same name. mochi gives them work with the agent tool. A resident definition keeps one standing
# conversation with its own memory. Any other definition runs as a fresh child for each job.

# Other people who may text mochi on iMessage, each in a thread of their own.
# [[users]]
# id = "user2"
# handle = "+15550100002"
# name = "Alex"

# App tools through an MCP server with execute and skills tools. Log in with: mochi auth apps
# appsUrl = "https://apps.example.com/mcp"

# Web search, fetch and the logged-in browser. The client speaks Firecrawl's v2 API.
# [web]
# keyEnv = "FIRECRAWL_API_KEY"
# url = "https://api.firecrawl.dev/v2"
# browserProfile = "mochi"

# Nightly self-improvement (skills/improve): judges yesterday's skill edits by measured signals, then proposes,
# applies and records new ones in <home>/improve/library.md. <home> must be a git repository.
# [[triggers]]
# kind = "cron"
# id = "improve"
# cron = "30 4 * * *"
# tz = "Asia/Kolkata"
# check = [ "node", "<repo>/scripts/improve-check.ts", "<home>", "24" ]
# model = "strongest"
# thinking = "high"
# prompt = "Run the improve skill: read its SKILL.md from the skills index, then follow it with the check output below."
