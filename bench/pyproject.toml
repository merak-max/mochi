[project]
name = "memory-bench"
version = "0.1.0"
requires-python = "==3.12.*"
dependencies = [
    "mem0ai[nlp]==2.2.1",
    "spacy==3.8.18",
    "en-core-web-sm",
    "fastembed==0.9.1",
    "graphiti-core[falkordb]==0.31.2",
    "openai==3.40.0",
    "aiohttp==3.14.5",
    "numpy==2.5.4",
    "nltk==3.9.2",
]

[tool.uv]
package = false

[tool.uv.sources]
en-core-web-sm = { url = "https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl" }
